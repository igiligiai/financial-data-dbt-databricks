version: 2

models:
  - name: gold_market_summary
    description: "Latest price snapshot per symbol enriched with company profile data"
    columns:
      - name: symbol
        description: "Stock ticker symbol"
        data_tests:
          - unique
          - not_null
      - name: company_name
        description: "Full company name"
      - name: sector
        description: "Market sector"
      - name: current_price
        description: "Most recent price"
      - name: market_cap
        description: "Market capitalization"
      - name: trailing_pe
        description: "Trailing P/E ratio"

  - name: gold_sector_performance
    description: "Sector-level aggregations including VWAP, average PE, and total market cap"
    columns:
      - name: sector
        description: "Market sector"
        data_tests:
          - unique
          - not_null
      - name: num_companies
        description: "Number of companies in sector"
      - name: total_market_cap
        description: "Sum of market caps in sector"
      - name: vwap
        description: "Volume-weighted average price across sector"

  - name: gold_best_performing_yesterday
    description: "Best performing stocks on the last completed trading day by daily gain percentage (day high vs previous close)"
    columns:
      - name: symbol
        description: "Stock ticker symbol"
        data_tests:
          - unique
          - not_null
      - name: company_name
        description: "Full company name"
      - name: sector
        description: "Market sector"
      - name: extracted_at_date
        description: "Date of the latest price extraction"
      - name: extracted_at_time
        description: "Time of the latest price extraction (HH:mm:ss)"
      - name: daily_gain_price
        description: "Absolute daily gain (day high minus previous close)"
      - name: daily_gain_percentage
        description: "Percentage daily gain relative to previous close"

  - name: gold_worst_performing_21d
    description: "Bottom 10 stocks by price decline over the last 21 days"
    columns:
      - name: symbol
        description: "Stock ticker symbol"
        data_tests:
          - unique
          - not_null
      - name: company_name
        description: "Full company name"
      - name: sector
        description: "Market sector"
      - name: period_start
        description: "Start date of the 21-day window"
      - name: period_end
        description: "End date of the 21-day window"
      - name: trading_days
        description: "Number of distinct trading days observed"
      - name: price_change
        description: "Absolute price change over the period"
      - name: price_change_pct
        description: "Percentage price change over the period"

  - name: gold_most_volatile
    description: "Top 10 most volatile stocks by average intraday range over the last 21 days"
    columns:
      - name: symbol
        description: "Stock ticker symbol"
        data_tests:
          - unique
          - not_null
      - name: company_name
        description: "Full company name"
      - name: sector
        description: "Market sector"
      - name: avg_intraday_range_pct
        description: "Average intraday high-low range as a percentage"
      - name: max_intraday_range_pct
        description: "Maximum single-day intraday range as a percentage"
      - name: coefficient_of_variation
        description: "Price standard deviation relative to mean price (%)"

  - name: gold_volume_anomalies
    description: "Stocks where today's volume exceeds the 21-day average by at least 1.5x"
    columns:
      - name: symbol
        description: "Stock ticker symbol"
        data_tests:
          - unique
          - not_null
      - name: company_name
        description: "Full company name"
      - name: sector
        description: "Market sector"
      - name: today_volume
        description: "Volume observed today"
      - name: avg_volume_21d
        description: "Average daily volume over the previous 21 days"
      - name: volume_ratio
        description: "Today's volume divided by the 21-day average"
      - name: volume_z_score
        description: "Z-score of today's volume relative to 21-day distribution"

  - name: gold_52_week_category
    description: "All stocks categorised by position relative to their 52-week range: within 5% of the high, within 5% of the low, or mid-range"
    columns:
      - name: symbol
        description: "Stock ticker symbol"
        data_tests:
          - not_null
      - name: company_name
        description: "Full company name"
      - name: sector
        description: "Market sector"
      - name: range_position_pct
        description: "Position within 52-week range (0=low, 100=high)"
      - name: proximity_signal
        description: "NEAR_52W_HIGH, NEAR_52W_LOW or MID_RANGE"
        data_tests:
          - accepted_values:
              arguments:
                values: ['NEAR_52W_HIGH', 'MID_RANGE', 'NEAR_52W_LOW']

  - name: gold_price_analytics
    description: "Per-symbol technical analytics: trend signals, 52-week positioning, and daily changes"
    columns:
      - name: symbol
        description: "Stock ticker symbol"
        data_tests:
          - unique
          - not_null
      - name: price_change_pct
        description: "Daily price change percentage"
      - name: trend_signal
        description: "BULLISH / BEARISH / NEUTRAL based on moving average crossovers"
        data_tests:
          - accepted_values:
              arguments:
                values: ['BULLISH', 'BEARISH', 'NEUTRAL']
      - name: range_52w_pct
        description: "Position within 52-week range (0=low, 100=high)"
