name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/templates/build_job.yml

  deploy-dev:
    if: github.event_name != 'pull_request'
    needs: build
    uses: ./.github/workflows/templates/deploy_job.yml
    with:
      target: dev
    secrets:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  deploy-prod:
    if: github.event_name == 'workflow_dispatch'
    needs: deploy-dev
    uses: ./.github/workflows/templates/deploy_job.yml
    with:
      target: prod
    secrets:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
