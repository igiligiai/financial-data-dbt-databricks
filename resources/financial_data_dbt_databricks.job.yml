resources:
  jobs:
    financial_data_dbt_databricks_job:
      name: financial_data_dbt_databricks_job
      email_notifications:
        on_failure:
          - anthony.igiligi@gmail.com
        on_success:
          - anthony.igiligi@gmail.com
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: HOURS

      email_notifications:
       on_failure:
         - anthony.igiligi@gmail.com
       on_success:
         - anthony.igiligi@gmail.com

      tasks:
        - task_key: extract_prices
          environment_key: python_env
          spark_python_task:
            python_file: ../datasets/databricks_extractor.py

        - task_key: dbt_run
          depends_on:
            - task_key: extract_prices
          environment_key: default
          dbt_task:
            project_directory: ../
            profiles_directory: dbt_profiles/
            commands:
              - 'dbt deps --target=${bundle.target}'
              - 'dbt run --target=${bundle.target}'

        - task_key: dbt_test
          depends_on:
            - task_key: dbt_run
          environment_key: default
          dbt_task:
            project_directory: ../
            profiles_directory: dbt_profiles/
            commands:
              - 'dbt deps --target=${bundle.target}'
              - 'dbt test --target=${bundle.target}'

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - dbt-databricks>=1.8.0,<2.0.0
        - environment_key: python_env
          spec:
            environment_version: "3"
            dependencies:
              - yfinance>=0.2.43

    financial_data_weekly_maintenance_job:
      name: financial_data_weekly_maintenance_job
      email_notifications:
        on_failure:
          - anthony.igiligi@gmail.com
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true

      trigger:
        periodic:
          interval: 1
          unit: WEEKS

      tasks:
        - task_key: dbt_weekly_optimize
          environment_key: default
          dbt_task:
            project_directory: ../
            profiles_directory: dbt_profiles/
            commands:
              - 'dbt deps --target=${bundle.target}'
              - 'dbt run-operation weekly_optimize --target=${bundle.target}'

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - dbt-databricks>=1.8.0,<2.0.0
