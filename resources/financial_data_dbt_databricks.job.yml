resources:
  jobs:
    financial_data_dbt_databricks_job:
      name: financial_data_dbt_databricks_job
      email_notifications:
        on_failure:
          - anthony.igiligi@gmail.com
        on_success:
          - anthony.igiligi@gmail.com
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true

      schedule:
        # Once per day at 09:00, Monday to Friday (Quartz cron syntax)
        quartz_cron_expression: "0 0 9 ? * MON-FRI"
        timezone_id: Europe/Berlin
        pause_status: ${var.trigger_status}

      tasks:
        # - task_key: extract_prices
        #   environment_key: python_env
        #   spark_python_task:
        #     python_file: ../datasets/databricks_extractor.py

        - task_key: check_raw_file_freshness
          sql_task:
            warehouse_id: ${var.sql_warehouse_id}
            file:
              path: ../src/sql/check_raw_file_freshness.sql
              source: WORKSPACE

        - task_key: raw_files_are_fresh
          depends_on:
            - task_key: check_raw_file_freshness
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.check_raw_file_freshness.output.first_row.should_run_dbt}}"
            right: "1"

        - task_key: dbt_run
          depends_on:
            - task_key: raw_files_are_fresh
              outcome: "true"
          environment_key: default
          dbt_task:
            project_directory: ../
            profiles_directory: dbt_profiles/
            commands:
              - 'dbt deps --target=${bundle.target}'
              - 'dbt run --target=${bundle.target}'

        - task_key: dbt_test
          depends_on:
            - task_key: dbt_run
          environment_key: default
          dbt_task:
            project_directory: ../
            profiles_directory: dbt_profiles/
            commands:
              - 'dbt deps --target=${bundle.target}'
              - 'dbt test --target=${bundle.target}'

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - dbt-databricks>=1.8.0,<2.0.0
        - environment_key: python_env
          spec:
            environment_version: "3"
            dependencies:
              - yfinance>=0.2.43
